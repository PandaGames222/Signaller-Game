name: Windows desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check the release tag version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [xml]$project = Get-Content Signaller.csproj
          $version = $project.Project.PropertyGroup.Version
          if ("v$version" -ne $env:RELEASE_TAG) {
            throw "Release tag $env:RELEASE_TAG does not match Signaller.csproj version v$version."
          }
          Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$version"

      - name: Run game-logic regression tests
        run: dotnet run --project tests\Signaller.GameLogic.Tests.csproj --configuration Release

      - name: Publish standalone Windows application
        shell: pwsh
        run: |
          dotnet publish Signaller.csproj --configuration Release --runtime win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -o dist\publish

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $programFilesX86 = [Environment]::GetEnvironmentVariable("ProgramFiles(x86)")
          $iscc = Join-Path $programFilesX86 "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found at $iscc."
          }
          & $iscc "/DAppVersion=$env:APP_VERSION" /DPublishDir="..\dist\publish" /DOutputDir="..\dist" installer\Signaller.iss
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create $env:RELEASE_TAG --verify-tag --title "Signaller v$env:APP_VERSION" --notes "Standalone Windows installer for Signaller v$env:APP_VERSION."

      - name: Publish installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $installer = "dist/Signaller-Setup-$($env:APP_VERSION).exe"
          if (-not (Test-Path $installer)) {
            throw "Expected installer was not built: $installer"
          }
          gh release upload $env:RELEASE_TAG $installer --clobber
